<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIBERTY — The American Project</title>
<style>
  /* Fonts are vendored (SIL Open Font License) so renders are identical offline. */
  @font-face { font-family: "Cinzel"; src: url(fonts/Cinzel.woff2) format("woff2"); font-weight: 400 900; font-display: block; }
  @font-face { font-family: "Cormorant Garamond"; src: url(fonts/CormorantGaramond-500.woff2) format("woff2"); font-weight: 500; font-display: block; }
  @font-face { font-family: "Cormorant Garamond"; src: url(fonts/CormorantGaramond-500i.woff2) format("woff2"); font-weight: 500; font-style: italic; font-display: block; }
  @font-face { font-family: "IBM Plex Mono"; src: url(fonts/IBMPlexMono-400.woff2) format("woff2"); font-weight: 400; font-display: block; }
  @font-face { font-family: "IBM Plex Mono"; src: url(fonts/IBMPlexMono-500.woff2) format("woff2"); font-weight: 500; font-display: block; }

  html, body { margin: 0; height: 100%; background: #000; color: #c9a54a; font: 13px "IBM Plex Mono", monospace; }
  #stage { position: fixed; inset: 0 0 56px 0; display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; background: #000; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; display: flex; gap: 12px; align-items: center; padding: 0 16px; box-sizing: border-box; border-top: 1px solid #2a2310; }
  #ui button { background: none; border: 1px solid #6b5521; color: #e2c372; font: inherit; padding: 6px 12px; cursor: pointer; }
  #ui input[type=range] { flex: 1; accent-color: #d4af37; }
  #ui select { background: #000; color: #e2c372; border: 1px solid #6b5521; font: inherit; }
  body.render #ui { display: none; }
  body.render #stage { inset: 0; }
  body.render canvas { max-width: none; max-height: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="ui">
  <button id="play">PAUSE</button>
  <span id="clock">0:00.0</span>
  <input id="scrub" type="range" min="0" max="135" step="0.01" value="0">
  <select id="jump"></select>
</div>
<script src="liberty.js"></script>
</body>
</html>
